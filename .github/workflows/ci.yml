name: CDTS checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test-only schema oracle
        run: python -m pip install "jsonschema>=4.20,<5"

      - name: Compile validator and checks
        run: python -m py_compile validator/cdts_validate.py validator/test_validator.py validator/test_schema_parity.py review/test_publication.py

      - name: Run complete test suite
        run: python -m unittest discover -v

      - name: Run publication checks explicitly
        run: python -m review.test_publication

      - name: Validate canonical example
        run: python validator/cdts_validate.py examples/mpaa-bec-execution.json
