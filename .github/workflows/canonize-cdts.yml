name: Canonize CDTS

on:
  push:
    paths:
      - tools/canonize_cdts.py
      - tools/fix_canonize_cdts.py
      - .github/workflows/canonize-cdts.yml

permissions:
  contents: write

jobs:
  canonize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install test-only schema oracle
        run: python -m pip install "jsonschema>=4.20,<5"

      - name: Apply migration and harness alignment
        run: |
          python tools/canonize_cdts.py
          python tools/fix_canonize_cdts.py

      - name: Run full suite
        run: |
          python -m json.tool ARTIFACT.json >/dev/null
          python -m compileall -q validator review
          python -m unittest discover -v
          python validator/cdts_validate.py examples/mpaa-bec-execution.json

      - name: Prepare pushable canonical state
        run: |
          rm tools/canonize_cdts.py tools/fix_canonize_cdts.py
          git restore .github/workflows/ci.yml

      - name: Commit canonical state
        run: |
          git config user.name "Experimental Harmony"
          git config user.email "gv1983us@gmail.com"
          git add -A
          git commit -m "canon: complete CDTS as sixth technical artifact"
          git push origin HEAD:main
